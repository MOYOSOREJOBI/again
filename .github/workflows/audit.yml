name: sentinel-audit
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Docker
        run: |
          docker version
          docker info

      - name: Run Gate
        run: |
          chmod +x scripts/*.sh || true
          chmod +x scripts/*.py || true
          ./scripts/gate.sh

      - name: Run Audit
        run: |
          ./scripts/audit.sh

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-audit-artifacts
          path: docs/audit/
